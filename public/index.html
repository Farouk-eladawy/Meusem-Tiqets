<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح التذاكر - القلعة والمتحف</title>
    <!-- مكتبة Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة html5-qrcode لتشغيل الكاميرا ومسح الـ QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        /* تحسين شكل مربع الكاميرا */
        #reader { width: 100%; border-radius: 0.5rem; overflow: hidden; border: 2px solid #e5e7eb; }
        #reader video { object-fit: cover; }
        /* إخفاء الرابط الإعلاني للمكتبة */
        #reader__dashboard_section_csr span a { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6 mt-4 relative">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">نظام مسح التذاكر 🎫</h1>
        
        <!-- شاشة البدء وطلب الأذونات -->
        <div id="start-screen" class="absolute inset-0 bg-white rounded-xl flex flex-col items-center justify-center z-10 p-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">مرحباً بك</h2>
            <p class="text-center text-gray-600 mb-6 text-sm">اضغط الزر ليظهر طلب المتصفح لصلاحية <strong>الكاميرا</strong> فقط، ثم اختر نوع التذكرة وابدأ المسح.</p>
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105">
                بدء النظام والسماح بالصلاحيات
            </button>
        </div>

        <!-- حاوية الكاميرا -->
        <div id="reader" class="mb-4"></div>

        <!-- اختيار نوع التذكرة (يظهر بعد تفعيل الكاميرا) -->
        <div id="ticket-type-section" class="hidden mb-4">
            <p class="text-sm font-semibold text-gray-700 mb-2 text-center">اختر نوع التذكرة للمسح:</p>
            <div class="flex gap-3">
                <button type="button" id="type-citadel" data-type="Citadel"
                    class="type-btn flex-1 text-center p-4 rounded-xl border-2 border-gray-200 bg-white font-semibold text-gray-800 transition-all hover:bg-gray-50">
                    🏰 القلعة
                </button>
                <button type="button" id="type-museum" data-type="Museum"
                    class="type-btn flex-1 text-center p-4 rounded-xl border-2 border-gray-200 bg-white font-semibold text-gray-800 transition-all hover:bg-gray-50">
                    🏛️ المتحف
                </button>
            </div>
            <p id="active-type-label" class="mt-3 text-center text-sm font-medium text-blue-700">اختر القلعة أو المتحف قبل المسح</p>
        </div>
        
        <!-- النتيجة والحالة -->
        <div id="status-container" class="hidden text-center p-4 rounded-lg mt-4 transition-all duration-300">
            <p id="status-message" class="font-semibold text-lg"></p>
            <p id="scanned-code" class="text-sm font-mono mt-2 bg-white bg-opacity-50 inline-block px-3 py-1 rounded"></p>
        </div>

        <div class="mt-4 text-center">
            <p class="text-xs text-gray-500">قم بتوجيه الكاميرا نحو كود QR الموجود على التذكرة.</p>
        </div>
    </div>

    <script>
        let html5QrCode;
        let isScanningPaused = false;
        let lastScannedCode = null;
        let audioContext = null;
        let systemStarted = false;
        let selectedTicketType = null;

        const SCANNED_STORAGE_KEY = 'scannedTickets_v1';
        const scannedTickets = loadScannedTickets();

        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const ticketTypeSection = document.getElementById('ticket-type-section');
        const activeTypeLabel = document.getElementById('active-type-label');
        const statusContainer = document.getElementById('status-container');
        const statusMessage = document.getElementById('status-message');
        const scannedCodeDisplay = document.getElementById('scanned-code');
        const typeButtons = document.querySelectorAll('.type-btn');

        function ticketKey(ticketCode, ticketType) {
            return `${ticketType}::${String(ticketCode).trim()}`;
        }

        function loadScannedTickets() {
            try {
                const raw = localStorage.getItem(SCANNED_STORAGE_KEY);
                const list = raw ? JSON.parse(raw) : [];
                return new Set(Array.isArray(list) ? list : []);
            } catch (e) {
                return new Set();
            }
        }

        function persistScannedTickets() {
            try {
                localStorage.setItem(SCANNED_STORAGE_KEY, JSON.stringify([...scannedTickets]));
            } catch (e) {
                console.warn('تعذر حفظ التذاكر الممسوحة محلياً:', e);
            }
        }

        function markTicketScanned(ticketCode, ticketType) {
            scannedTickets.add(ticketKey(ticketCode, ticketType));
            persistScannedTickets();
        }

        function isTicketAlreadyScanned(ticketCode, ticketType) {
            return scannedTickets.has(ticketKey(ticketCode, ticketType));
        }

        function getTypeNameArabic(ticketType) {
            return ticketType === 'Citadel' ? 'القلعة' : 'المتحف';
        }

        function setSelectedTicketType(ticketType) {
            selectedTicketType = ticketType;

            typeButtons.forEach(btn => {
                const isActive = btn.dataset.type === ticketType;
                btn.classList.toggle('border-blue-600', isActive);
                btn.classList.toggle('bg-blue-50', isActive);
                btn.classList.toggle('ring-2', isActive);
                btn.classList.toggle('ring-blue-300', isActive);
                btn.classList.toggle('border-gray-200', !isActive);
                btn.classList.toggle('bg-white', !isActive);
            });

            activeTypeLabel.textContent = `جاري المسح لتذاكر: ${getTypeNameArabic(ticketType)}`;
            activeTypeLabel.classList.remove('text-amber-700');
            activeTypeLabel.classList.add('text-blue-700');
        }

        function getSelectedTicketType() {
            return selectedTicketType;
        }

        // تفعيل الصوت عند أول ضغطة (لا يحتاج إذن ميكروفون؛ فقط لتشغيل التنبيهات)
        function unlockAudio() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;

            audioContext = audioContext || new AudioCtx();
            if (audioContext.state === 'suspended') {
                audioContext.resume().catch(() => {});
            }

            // بدون نغمة عند البدء حتى لا يُظن أنها أذونات صوت/مايكروفون
            // التنبيه الصوتي يعمل لاحقاً عند المسح فقط
        }

        // تشغيل تنبيه صوتي عند المسح
        function playBeep(frequency = 980, duration = 0.12, volume = 0.18) {
            if (!audioContext) return;

            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.value = frequency;
                gainNode.gain.value = volume;

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                const now = audioContext.currentTime;
                oscillator.start(now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);
                oscillator.stop(now + duration);
            } catch (e) {
                console.warn('تعذر تشغيل الصوت:', e);
            }
        }

        function playSuccessSound() {
            playBeep(980, 0.12, 0.18);
        }

        function playErrorSound() {
            playBeep(220, 0.22, 0.22);
        }

        function permissionErrorMessage(err) {
            const name = err && (err.name || err);
            if (!window.isSecureContext) {
                return 'يجب فتح الموقع عبر HTTPS حتى يظهر طلب صلاحية الكاميرا.';
            }
            if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
                return 'تم رفض صلاحية الكاميرا. من إعدادات المتصفح اسمح بالكاميرا ثم أعد المحاولة.';
            }
            if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
                return 'لم يتم العثور على كاميرا على هذا الجهاز.';
            }
            if (name === 'NotReadableError' || name === 'TrackStartError') {
                return 'الكاميرا مستخدمة من تطبيق آخر. أغلقه ثم أعد المحاولة.';
            }
            return 'تعذر فتح الكاميرا. اسمح بالصلاحية عند ظهور رسالة المتصفح ثم أعد المحاولة.';
        }

        // دالة عرض الحالة للمستخدم (سريعة جداً)
        function showStatus(message, code, type = 'success') {
            statusContainer.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'bg-amber-100', 'text-amber-900');
            
            if (type === 'success') {
                statusContainer.classList.add('bg-green-100', 'text-green-800');
            } else if (type === 'duplicate') {
                statusContainer.classList.add('bg-amber-100', 'text-amber-900');
            } else {
                statusContainer.classList.add('bg-red-100', 'text-red-800');
            }

            statusMessage.innerText = message;
            scannedCodeDisplay.innerText = code ? code : '';
            
            // إخفاء الرسالة بسرعة كبيرة لتجهيز الشاشة للكود التالي
            setTimeout(() => {
                if(lastScannedCode === code) { 
                    statusContainer.classList.add('hidden');
                }
            }, type === 'duplicate' ? 1600 : 800);
        }

        function pauseScanningBriefly(ms = 900) {
            isScanningPaused = true;
            setTimeout(() => {
                isScanningPaused = false;
            }, ms);
        }

        // دالة الإرسال مع التحقق من التكرار
        async function sendToAirtable(ticketCode, ticketType) {
            const response = await fetch('/.netlify/functions/submit-qr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    ticketCode: ticketCode,
                    ticketType: ticketType
                })
            });

            let payload = {};
            try {
                payload = await response.json();
            } catch (e) {
                payload = {};
            }

            if (response.status === 409 || payload.duplicate) {
                return { ok: false, duplicate: true, payload };
            }

            if (!response.ok) {
                return { ok: false, duplicate: false, payload };
            }

            return { ok: true, duplicate: false, payload };
        }

        // عند التقاط كود QR بنجاح
        async function onScanSuccess(decodedText) {
            const ticketCode = String(decodedText || '').trim();
            if (!ticketCode || isScanningPaused) return;

            // منع إعادة قراءة نفس الكود المتتالية فوراً من الكاميرا
            if (ticketCode === lastScannedCode) return;

            const currentType = getSelectedTicketType();
            if (!currentType) {
                lastScannedCode = ticketCode;
                pauseScanningBriefly(1200);
                playErrorSound();
                showStatus('اختر نوع التذكرة أولاً (قلعة أو متحف)', ticketCode, 'error');
                activeTypeLabel.textContent = 'يجب اختيار القلعة أو المتحف قبل المسح';
                activeTypeLabel.classList.remove('text-blue-700');
                activeTypeLabel.classList.add('text-amber-700');
                setTimeout(() => {
                    if (lastScannedCode === ticketCode) lastScannedCode = null;
                }, 1500);
                return;
            }

            const typeNameArabic = getTypeNameArabic(currentType);

            lastScannedCode = ticketCode;
            pauseScanningBriefly(1200);

            // حماية محلية فورية (نفس الجهاز)
            if (isTicketAlreadyScanned(ticketCode, currentType)) {
                playErrorSound();
                showStatus(`التذكرة مستخدمة مسبقاً (${typeNameArabic}) ⚠️`, ticketCode, 'duplicate');
                setTimeout(() => {
                    if (lastScannedCode === ticketCode) lastScannedCode = null;
                }, 1500);
                return;
            }

            // نضع علامة مؤقتة لمنع المسح المزدوج أثناء الانتظار
            markTicketScanned(ticketCode, currentType);
            showStatus(`جاري التحقق (${typeNameArabic})...`, ticketCode, 'success');

            try {
                const result = await sendToAirtable(ticketCode, currentType);

                if (result.duplicate) {
                    playErrorSound();
                    showStatus(`التذكرة مستخدمة مسبقاً (${typeNameArabic}) ⚠️`, ticketCode, 'duplicate');
                } else if (result.ok) {
                    playSuccessSound();
                    showStatus(`تم الحفظ (${typeNameArabic}) ✅`, ticketCode, 'success');
                    console.log(`تم تسجيل التذكرة (${currentType}) بنجاح:`, ticketCode);
                } else {
                    // فشل الشبكة/الخادم: نسمح بإعادة المحاولة لاحقاً
                    scannedTickets.delete(ticketKey(ticketCode, currentType));
                    persistScannedTickets();
                    playErrorSound();
                    showStatus('فشل التسجيل، أعد المسح', ticketCode, 'error');
                }
            } catch (error) {
                console.error('فشل الاتصال بالخادم:', error);
                scannedTickets.delete(ticketKey(ticketCode, currentType));
                persistScannedTickets();
                playErrorSound();
                showStatus('فشل الاتصال، أعد المسح', ticketCode, 'error');
            }

            setTimeout(() => {
                if (lastScannedCode === ticketCode) lastScannedCode = null;
            }, 1500);
        }

        // طلب صلاحية الكاميرا فقط (بدون مايكروفون) — يظهر حوار المتصفح
        async function requestCameraPermission() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                const err = new Error('NotSupportedError');
                err.name = 'NotSupportedError';
                throw err;
            }

            const stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

            // نوقف البث فوراً؛ المكتبة ستفتح الكاميرا للمسح بعد الموافقة
            stream.getTracks().forEach(track => track.stop());
        }

        async function startCamera() {
            html5QrCode = html5QrCode || new Html5Qrcode("reader");

            const config = { 
                fps: 30,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };

            // بعد منح الإذن: نفضّل الكاميرا الخلفية إن وُجدت
            try {
                const cameras = await Html5Qrcode.getCameras();
                if (cameras && cameras.length > 0) {
                    const backCamera =
                        cameras.find(c => /back|rear|environment|خلفية/i.test(c.label)) ||
                        cameras[cameras.length - 1];

                    await html5QrCode.start(
                        backCamera.id,
                        config,
                        onScanSuccess,
                        () => {}
                    );
                    return;
                }
            } catch (e) {
                console.warn('تعذر تعداد الكاميرات، نجرب facingMode:', e);
            }

            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    () => {}
                );
            } catch (primaryError) {
                const name = primaryError && primaryError.name;
                if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
                    throw primaryError;
                }

                await html5QrCode.start(
                    { facingMode: "user" },
                    config,
                    onScanSuccess,
                    () => {}
                );
            }
        }

        async function startSystem() {
            if (systemStarted) return;

            startBtn.disabled = true;
            startBtn.textContent = 'جاري طلب صلاحية الكاميرا...';

            try {
                // الأهم: طلب الكاميرا أولاً مباشرة من ضغطة الزر ليظهر حوار المتصفح
                await requestCameraPermission();

                // تفعيل تنبيهات الصوت بعد منح الكاميرا (بدون طلب مايكروفون)
                unlockAudio();

                await startCamera();

                systemStarted = true;
                startScreen.classList.add('hidden');
                ticketTypeSection.classList.remove('hidden');
            } catch (err) {
                console.error('فشل طلب الأذونات أو تشغيل الكاميرا:', err);
                startBtn.disabled = false;
                startBtn.textContent = 'بدء النظام والسماح بالصلاحيات';
                alert(permissionErrorMessage(err));
            }
        }

        // الانتظار لضغط المستخدم قبل طلب الأذونات (مطلوب من المتصفح)
        document.addEventListener('DOMContentLoaded', () => {
            startBtn.addEventListener('click', startSystem);

            typeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    setSelectedTicketType(btn.dataset.type);
                });
            });
        });
    </script>
</body>
</html>
