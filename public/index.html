<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح التذاكر - القلعة والمتحف</title>
    <!-- مكتبة Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة html5-qrcode لتشغيل الكاميرا ومسح الـ QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        /* تحسين شكل مربع الكاميرا */
        #reader { width: 100%; border-radius: 0.5rem; overflow: hidden; border: 2px solid #e5e7eb; }
        #reader video { object-fit: cover; }
        /* إخفاء الرابط الإعلاني للمكتبة */
        #reader__dashboard_section_csr span a { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6 mt-4 relative">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">نظام مسح التذاكر 🎫</h1>
        
        <!-- شاشة البدء وطلب الأذونات -->
        <div id="start-screen" class="absolute inset-0 bg-white rounded-xl flex flex-col items-center justify-center z-10 p-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">مرحباً بك</h2>
            <p class="text-center text-gray-600 mb-6 text-sm">نحتاج إلى صلاحية استخدام الكاميرا لمسح التذاكر، والصوت لتشغيل التنبيهات.</p>
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105">
                بدء النظام والسماح بالصلاحيات
            </button>
        </div>

        <!-- اختيار نوع التذكرة -->
        <div class="mb-6">
            <p class="text-sm font-semibold text-gray-700 mb-2">اختر نوع التذكرة أولاً:</p>
            <div class="flex gap-4">
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="ticketType" value="Citadel" class="peer hidden" checked>
                    <div class="text-center p-3 rounded-lg border-2 border-gray-200 peer-checked:border-blue-500 peer-checked:bg-blue-50 hover:bg-gray-50 transition-all">
                        🏰 القلعة
                    </div>
                </label>
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="ticketType" value="Museum" class="peer hidden">
                    <div class="text-center p-3 rounded-lg border-2 border-gray-200 peer-checked:border-blue-500 peer-checked:bg-blue-50 hover:bg-gray-50 transition-all">
                        🏛️ المتحف
                    </div>
                </label>
            </div>
        </div>

        <!-- حاوية الكاميرا -->
        <div id="reader" class="mb-4"></div>
        
        <!-- النتيجة والحالة (Optimistic UI) -->
        <div id="status-container" class="hidden text-center p-4 rounded-lg mt-4 transition-all duration-300">
            <p id="status-message" class="font-semibold text-lg"></p>
            <p id="scanned-code" class="text-sm font-mono mt-2 bg-white bg-opacity-50 inline-block px-3 py-1 rounded"></p>
        </div>

        <div class="mt-4 text-center">
            <p class="text-xs text-gray-500">قم بتوجيه الكاميرا نحو كود QR الموجود على التذكرة.</p>
        </div>
    </div>

    <script>
        let html5QrCode;
        let isScanningPaused = false;
        let lastScannedCode = null;
        let audioContext = null;
        let systemStarted = false;

        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const statusContainer = document.getElementById('status-container');
        const statusMessage = document.getElementById('status-message');
        const scannedCodeDisplay = document.getElementById('scanned-code');

        // الحصول على نوع التذكرة المحدد
        function getSelectedTicketType() {
            return document.querySelector('input[name="ticketType"]:checked').value;
        }

        // تفعيل الصوت عند أول تفاعل (مطلوب من المتصفح)
        async function unlockAudio() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;

            audioContext = audioContext || new AudioCtx();
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            // نغمة قصيرة لتأكيد تفعيل الصوت وفتح مسار التشغيل
            playBeep(880, 0.08, 0.05);
        }

        // تشغيل تنبيه صوتي عند المسح
        function playBeep(frequency = 980, duration = 0.12, volume = 0.18) {
            if (!audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.value = frequency;
            gainNode.gain.value = volume;

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            const now = audioContext.currentTime;
            oscillator.start(now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);
            oscillator.stop(now + duration);
        }

        // طلب أذونات الكاميرا والصوت معاً عند أول مرة
        async function requestPermissions() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error('المتصفح لا يدعم الوصول للكاميرا أو الصوت.');
            }

            // طلب الكاميرا + الميكروفون معاً ليظهر حوار الأذونات للمستخدم
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: true
            });

            // نوقف المسارات فوراً؛ html5-qrcode سيفتح الكاميرا من جديد للمسح
            stream.getTracks().forEach(track => track.stop());
            await unlockAudio();
        }

        // دالة عرض الحالة للمستخدم (سريعة جداً)
        function showStatus(message, code, type = 'success') {
            statusContainer.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (type === 'success') {
                statusContainer.classList.add('bg-green-100', 'text-green-800');
            } else {
                statusContainer.classList.add('bg-red-100', 'text-red-800');
            }

            statusMessage.innerText = message;
            scannedCodeDisplay.innerText = code ? code : '';
            
            // إخفاء الرسالة بسرعة كبيرة لتجهيز الشاشة للكود التالي
            setTimeout(() => {
                if(lastScannedCode === code) { 
                    statusContainer.classList.add('hidden');
                }
            }, 800); // 0.8 ثانية فقط
        }

        // دالة الإرسال في الخلفية (Optimistic UI)
        async function sendToAirtableBackground(ticketCode, ticketType) {
            try {
                const response = await fetch('/.netlify/functions/submit-qr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        ticketCode: ticketCode,
                        ticketType: ticketType
                    })
                });
                
                if (!response.ok) {
                    console.error('خطأ في الإرسال إلى Netlify/Airtable');
                } else {
                    console.log(`تم تسجيل التذكرة (${ticketType}) بنجاح:`, ticketCode);
                }
            } catch (error) {
                console.error('فشل الاتصال بالخادم:', error);
            }
        }

        // عند التقاط كود QR بنجاح
        function onScanSuccess(decodedText, decodedResult) {
            if (isScanningPaused || decodedText === lastScannedCode) return;

            // إيقاف مؤقت سريع جداً لمنع القراءة المزدوجة لنفس الكود في نفس اللحظة
            isScanningPaused = true;
            lastScannedCode = decodedText;
            const currentType = getSelectedTicketType();
            const typeNameArabic = currentType === 'Citadel' ? 'القلعة' : 'المتحف';

            // تنبيه صوتي + إبلاغ المستخدم فوراً
            playBeep();
            showStatus(`تم الحفظ (${typeNameArabic}) ✅`, decodedText, 'success');

            // الإرسال في الخلفية
            sendToAirtableBackground(decodedText, currentType);

            // إعادة التفعيل السريع جداً (يحاكي الماكينات)
            setTimeout(() => {
                isScanningPaused = false;
                // نسمح بمسح نفس التذكرة مرة أخرى بعد 2.5 ثانية (لتجنب المسح المزدوج بالخطأ للورقة نفسها)
                setTimeout(() => { lastScannedCode = null; }, 2500);
            }, 500); // نصف ثانية فقط ويكون جاهز للتذكرة الجديدة
        }

        async function startCamera() {
            html5QrCode = html5QrCode || new Html5Qrcode("reader");

            const config = { 
                fps: 30, // سرعة مسح عالية جداً (30 إطار في الثانية)
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };

            await html5QrCode.start(
                { facingMode: "environment" }, // الكاميرا الخلفية
                config,
                onScanSuccess,
                (error) => { /* تجاهل أخطاء التركيز الطبيعية */ }
            );
        }

        async function startSystem() {
            if (systemStarted) return;

            startBtn.disabled = true;
            startBtn.textContent = 'جاري طلب الأذونات...';

            try {
                await requestPermissions();
                await startCamera();

                systemStarted = true;
                startScreen.classList.add('hidden');
            } catch (err) {
                console.error('فشل طلب الأذونات أو تشغيل الكاميرا:', err);
                startBtn.disabled = false;
                startBtn.textContent = 'بدء النظام والسماح بالصلاحيات';
                alert('الرجاء السماح بصلاحيات الكاميرا والصوت ليعمل النظام.');
            }
        }

        // الانتظار لضغط المستخدم قبل طلب الأذونات (مطلوب من المتصفح)
        document.addEventListener('DOMContentLoaded', () => {
            startBtn.addEventListener('click', startSystem);
        });
    </script>
</body>
</html>
